<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="password.title">Generator hasel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
</head>
<body>
    <h1 data-i18n="password.h1">Generator hasel</h1>

    <label data-i18n="password.length">Dlugosc hasla:</label>
    <input type="number" id="length" value="8" min="4">

    <label><input type="checkbox" id="uppercase"> <span data-i18n="password.uppercase">Uwzglednij wielkie litery</span></label>
    <label><input type="checkbox" id="special"> <span data-i18n="password.special">Uwzglednij znaki specjalne</span></label>
    <label><input type="checkbox" id="digits"> <span data-i18n="password.digits">Uwzglednij cyfry</span></label>

    <button data-i18n="password.generate" onclick="generatePassword()">Generuj haslo</button>

    <h3 data-i18n="password.result">Wygenerowane haslo:</h3>
    <p id="result"></p>

    <button data-i18n="common.back" onclick="window.location.href='{{ url_for('pages.home') }}'">Powrot</button>

    <script>
        async function generatePassword() {
            const length = document.getElementById("length").value;
            const includeUppercase = document.getElementById("uppercase").checked;
            const includeSpecial = document.getElementById("special").checked;
            const includeDigits = document.getElementById("digits").checked;

            const response = await I18n.apiFetch("api/generate_password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    length: parseInt(length),
                    include_uppercase: includeUppercase,
                    include_special: includeSpecial,
                    include_digits: includeDigits
                })
            });

            const data = await response.json();
            document.getElementById("result").innerText = data.password || data.error;
        }
    </script>
</body>
</html>
