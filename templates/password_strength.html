<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="password_strength.title">Ocena siły hasła</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
</head>
<body>
    <h1 data-i18n="password_strength.h1">Ocena siły hasła</h1>
    <p data-i18n="password_strength.privacy_notice">
        Hasło nie jest nigdzie zapisywane. Analiza jest wykonywana tylko na potrzeby bieżącego wyniku.
    </p>

    <label for="passwordInput" data-i18n="password_strength.password_label">Hasło:</label>
    <div style="display: flex; justify-content: center; align-items: center; gap: 8px;">
        <input type="password" id="passwordInput" style="width: 90%; max-width: 500px;">
        <button type="button" id="togglePasswordBtn" style="padding: 8px 12px;">Pokaż</button>
    </div>

    <h3 data-i18n="password_strength.result_title">Wynik:</h3>
    <p id="statusResult" data-i18n="password_strength.waiting_input">Wpisz hasło, aby zobaczyć analizę.</p>
    <div style="width: 90%; max-width: 500px; height: 10px; background: #ddd; border-radius: 999px; margin: 0 auto 12px auto;">
        <div id="scoreBar" style="height: 10px; width: 0%; border-radius: 999px; background: #d9534f; transition: width 0.2s ease;"></div>
    </div>
    <p id="scoreResult">-</p>
    <h4 data-i18n="password_strength.crack_time_title">Szacowany czas łamania (różne scenariusze):</h4>
    <ul id="crackTimeList" style="width: 90%; max-width: 900px; margin: 0 auto; text-align: left;"></ul>
    <p id="crackTimeNote"></p>
    <p id="warningResult"></p>
    <ul id="suggestionsList"></ul>

    <button data-i18n="common.back" onclick="window.location.href='/'">Powrót</button>

    <script>
        let debounceTimer = null;

        function updateStrengthBar(score) {
            const colors = ["#d9534f", "#f0ad4e", "#f7e359", "#8bc34a", "#2e7d32"];
            const clampedScore = Math.max(0, Math.min(4, Number(score) || 0));
            const percentage = (clampedScore / 4) * 100;
            const scoreBar = document.getElementById("scoreBar");
            scoreBar.style.width = `${percentage}%`;
            scoreBar.style.background = colors[clampedScore];
        }

        function resetResults() {
            const statusResult = document.getElementById("statusResult");
            const scoreResult = document.getElementById("scoreResult");
            const crackTimeList = document.getElementById("crackTimeList");
            const crackTimeNote = document.getElementById("crackTimeNote");
            const warningResult = document.getElementById("warningResult");
            const suggestionsList = document.getElementById("suggestionsList");
            statusResult.textContent = I18n.t("password_strength.waiting_input");
            scoreResult.textContent = "-";
            crackTimeList.innerHTML = "";
            crackTimeNote.textContent = "";
            warningResult.textContent = "";
            suggestionsList.innerHTML = "";
            updateStrengthBar(0);
        }

        async function checkStrength() {
            const password = document.getElementById("passwordInput").value;

            if (!password) {
                resetResults();
                return;
            }

            const response = await I18n.apiFetch("/api/password_strength", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password }),
            });

            const data = await response.json();
            const statusResult = document.getElementById("statusResult");
            const scoreResult = document.getElementById("scoreResult");
            const crackTimeList = document.getElementById("crackTimeList");
            const crackTimeNote = document.getElementById("crackTimeNote");
            const warningResult = document.getElementById("warningResult");
            const suggestionsList = document.getElementById("suggestionsList");
            crackTimeList.innerHTML = "";
            suggestionsList.innerHTML = "";

            if (!response.ok) {
                statusResult.textContent = I18n.t("password_strength.error_status");
                scoreResult.textContent = `${I18n.t("password_strength.error_prefix")} ${data.error || I18n.t("password_strength.unknown_error")}`;
                crackTimeNote.textContent = "";
                warningResult.textContent = "";
                updateStrengthBar(0);
                return;
            }

            statusResult.textContent = I18n.t("password_strength.live_status");
            scoreResult.textContent = `${I18n.t("password_strength.score_label")}: ${data.score_label} (${data.score}/4)`;
            (data.crack_time.scenarios || []).forEach((scenario) => {
                const li = document.createElement("li");
                const badge = scenario.is_recommended ? ` [${I18n.t("password_strength.recommended_badge")}]` : "";
                li.textContent = `${scenario.label}: ${scenario.time}${badge} - ${scenario.description}`;
                crackTimeList.appendChild(li);
            });
            crackTimeNote.textContent = data.crack_time.recommended_note || "";
            warningResult.textContent = data.feedback.warning
                ? `${I18n.t("password_strength.warning_label")}: ${data.feedback.warning}`
                : "";
            updateStrengthBar(data.score);

            (data.feedback.suggestions || []).forEach((suggestion) => {
                const li = document.createElement("li");
                li.textContent = suggestion;
                suggestionsList.appendChild(li);
            });
        }

        function scheduleCheck() {
            if (debounceTimer) {
                clearTimeout(debounceTimer);
            }
            debounceTimer = setTimeout(() => {
                checkStrength();
            }, 200);
        }

        function updatePasswordToggleLabel() {
            const passwordInput = document.getElementById("passwordInput");
            const toggleBtn = document.getElementById("togglePasswordBtn");
            if (passwordInput.type === "password") {
                toggleBtn.textContent = I18n.t("password_strength.show_password");
            } else {
                toggleBtn.textContent = I18n.t("password_strength.hide_password");
            }
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("passwordInput");
            passwordInput.type = passwordInput.type === "password" ? "text" : "password";
            updatePasswordToggleLabel();
        }

        document.getElementById("passwordInput").addEventListener("input", scheduleCheck);
        document.getElementById("togglePasswordBtn").addEventListener("click", togglePasswordVisibility);
        updatePasswordToggleLabel();

        window.onLanguageChange = () => {
            updatePasswordToggleLabel();
            const hasPassword = !!document.getElementById("passwordInput").value;
            if (hasPassword) {
                checkStrength();
            } else {
                resetResults();
            }
        };
    </script>
</body>
</html>
