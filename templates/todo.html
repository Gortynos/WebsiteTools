<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="todo.title">Lista zadan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
</head>
<body>
    <h1 data-i18n="todo.h1">Lista zadan</h1>

    <input type="text" id="taskInput" data-i18n-placeholder="todo.placeholder" placeholder="Wpisz zadanie">
    <button data-i18n="todo.add" onclick="addTask()">Dodaj zadanie</button>

    <ul id="taskList"></ul>

    <button data-i18n="common.back" onclick="window.location.href='/'">Powrot</button>

    <script>
        async function loadTasks() {
            const response = await I18n.apiFetch("/api/tasks");
            const data = await response.json();
            const taskList = document.getElementById("taskList");
            taskList.innerHTML = "";

            data.tasks.forEach((task, index) => {
                const li = document.createElement("li");
                const statusLabel = task.complete
                    ? I18n.t("todo.status_completed")
                    : I18n.t("todo.status_not_completed");
                li.innerHTML = `
                    ${task.description} | ${statusLabel} | ${I18n.t("todo.created_at")}: ${task.create_time}
                    <button onclick="toggleTask(${index})">✔</button>
                    <button onclick="deleteTask(${index})">❌</button>
                `;
                taskList.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById("taskInput").value;
            if (!input) return alert(I18n.t("todo.empty_alert"));

            await I18n.apiFetch("/api/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ description: input })
            });

            document.getElementById("taskInput").value = "";
            loadTasks();
        }

        async function deleteTask(taskId) {
            await I18n.apiFetch(`/api/tasks/${taskId}`, { method: "DELETE" });
            loadTasks();
        }

        async function toggleTask(taskId) {
            await I18n.apiFetch(`/api/tasks/${taskId}`, { method: "PUT" });
            loadTasks();
        }

        window.onLanguageChange = () => {
            loadTasks();
        };

        loadTasks();
    </script>
</body>
</html>
